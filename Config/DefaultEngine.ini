;==============================================================================
;  DefaultEngine.ini  -  Reusable performance-tuned engine config (UE 5.3 - 5.7)
;==============================================================================
;  HOW TO USE
;   1. Merge the sections below into <YourProject>/Config/DefaultEngine.ini.
;      Keep your project's own [/Script/EngineSettings.GameMapsSettings],
;      [/Script/Engine.CollisionProfile], redirects, plugin sections, etc.
;   2. Copy DefaultScalability.ini and DefaultGame.ini from this folder too.
;   3. Restart the editor (many render settings are read-only at startup and
;      trigger a shader recompile).
;
;  GOLDEN RULE - CVAR PRIORITY
;   Unreal applies cvars in this priority order (low -> high):
;     Constructor < Scalability < GameSetting < ProjectSetting (RendererSettings)
;     < SystemSettingsIni ([SystemSettings]) < DeviceProfile
;     < ConsoleVariablesIni ([ConsoleVariables]) < Commandline < Console
;   Anything set here in [/Script/Engine.RendererSettings], [SystemSettings] or
;   [ConsoleVariables] OVERRIDES the quality presets and "locks" it for every
;   Low/Medium/High/Epic tier. Therefore:
;     * Per-quality cvars (shadows, GI, reflections, post, textures, effects,
;       foliage, view distance) live ONLY in DefaultScalability.ini.
;     * This file only holds project-wide, tier-independent settings.
;
;  Cvars that do not exist in your engine version are ignored (logged once),
;  so version-specific lines are safe. Those are tagged [5.x+].
;==============================================================================


;------------------------------------------------------------------------------
;  RENDERING PIPELINE (Project Settings > Engine > Rendering)
;------------------------------------------------------------------------------
[/Script/Engine.RendererSettings]

; ---- Lighting model ---------------------------------------------------------
; Fully dynamic lighting (Lumen) is the default of this template.
; Disabling static lighting removes lightmap shader permutations and the
; precomputed-lighting paths from the base pass -> fewer shaders, less memory,
; faster cooks. Set True ONLY if the project bakes lightmaps (GPU Lightmass).
r.AllowStaticLighting=False

; 1 = Lumen, 0 = None, 2 = SSGI. Lumen is scaled/disabled per tier in
; DefaultScalability.ini via r.Lumen.DiffuseIndirect.Allow.
r.DynamicGlobalIlluminationMethod=1
; 1 = Lumen, 2 = SSR, 0 = None. Scaled per tier via r.Lumen.Reflections.Allow.
r.ReflectionMethod=1
; Lumen software tracing needs mesh distance fields.
r.GenerateMeshDistanceFields=True
; Hardware ray tracing: off by default (saves VRAM + BVH build cost on the
; GPU). Turn both on for RT-heavy projects targeting RTX 20xx / RDNA2 or newer.
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
; Software ray tracing mode: 1 = detail tracing (mesh SDFs), 0 = global SDF
; only. Per-tier on/off is handled by r.Lumen.TraceMeshSDFs.Allow.
r.Lumen.TraceMeshSDFs=1

; ---- Shadows ----------------------------------------------------------------
; 1 = Virtual Shadow Maps (best fit for Nanite), 0 = cascaded shadow maps.
; VSM cost is scaled in DefaultScalability.ini (page pool, LOD bias, SMRT).
r.Shadow.Virtual.Enable=1

; ---- Geometry ---------------------------------------------------------------
r.Nanite.ProjectEnabled=True
; GPU skin cache: skins each skeletal mesh once per frame on the GPU instead of
; per pass (depth, base, velocity, shadows). Big win with many characters and
; required for ray tracing skinned meshes.
r.SkinCache.CompileShaders=True
r.SkinCache.Mode=1
; Depth-only/reversed index buffers speed up depth & shadow passes for
; non-Nanite meshes.
r.SupportDepthOnlyIndexBuffers=True
r.SupportReversedIndexBuffers=True

; ---- Anti-aliasing & resolution --------------------------------------------
; 4 = TSR (Temporal Super Resolution). Pair with upscaling below.
r.AntiAliasingMethod=4
; Default screen percentage is derived from display resolution
; (e.g. 4K -> ~50% internal, 1080p -> 100%), then upscaled by TSR.
r.ScreenPercentage.Default.Desktop.Mode=1

; ---- Textures & streaming ---------------------------------------------------
r.TextureStreaming=True
r.VirtualTextures=True
; Don't set r.Streaming.PoolSize here - it would override TextureQuality tiers.

; ---- Shader permutation reduction (faster cooks, smaller PSO cache) --------
; True = keep only the active material quality level in memory (saves RAM),
; but changing r.MaterialQualityLevel at runtime then needs a restart.
; Keep False for PC games with an in-game quality menu; True for fixed-spec
; targets (consoles, handhelds).
r.DiscardUnusedQuality=False
; Leave unused features off. Enable only what the project needs.
r.SupportSkyAtmosphereAffectsHeightFog=True
r.SupportLowQualityLightmaps=False
r.SupportPointLightWholeSceneShadows=True

; ---- Default post-process (can still be overridden per PP volume) ----------
; Auto exposure + motion blur defaults are kept; they are scaled per tier.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False
; Lens flares are rarely worth their cost; enable per-volume if needed.
r.DefaultFeature.LensFlare=False

; ---- PSO precaching: kill first-use shader compile hitches (UE 5.2+) -------
; Precache PSOs when components/materials load, and only draw a primitive once
; its PSO is ready (avoids a stall; object pops in a frame later instead).
r.PSOPrecaching=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
; Keep drawing even if a PSO is late (0 = never skip draws, recommended).
r.SkipDrawOnPSOPrecaching=0
; Validation (1/2) is for profiling missed PSOs with "stat psocache";
; keep 0 for shipping.
r.PSOPrecache.Validation=0
; Bundled PSO cache (recorded .spc) covers what precaching cannot predict
; (global shaders, compute, etc.). "Light" mode: only record non-precachable.
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.ExcludePrecachePSO=1
; 2 = compile the bundled cache in the background (e.g. behind main menu).
; Call r.ShaderPipelineCache.SetBatchMode fast during loading screens.
r.ShaderPipelineCache.StartupMode=2


;------------------------------------------------------------------------------
;  SHADER STABLE KEYS - needed to record/ship the bundled PSO cache
;------------------------------------------------------------------------------
[DevOptions.Shaders]
NeedsShaderStableKeys=true


;------------------------------------------------------------------------------
;  WINDOWS RHI (ignored on other platforms)
;------------------------------------------------------------------------------
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX12 + SM6 is required for Nanite, Lumen, VSM, mesh shaders & bindless.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
; Audio mixer: offload source processing to worker threads, sane voice budget.
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024
AudioNumBuffersToEnqueue=1
AudioMaxChannels=64
AudioNumSourceWorkers=4


;------------------------------------------------------------------------------
;  ENGINE CORE
;------------------------------------------------------------------------------
[/Script/Engine.Engine]
; Never let the engine throttle/smooth the frame rate for you; use
; t.MaxFPS / the game user settings frame limiter instead.
bSmoothFrameRate=False
bUseFixedFrameRate=False
; Animation update on worker threads (per-component opt-in still applies).
bAllowMultiThreadedAnimationUpdate=True


;------------------------------------------------------------------------------
;  ASYNC LOADING & LEVEL STREAMING (Project Settings > Engine > Streaming)
;------------------------------------------------------------------------------
[/Script/Engine.StreamingSettings]
; Load packages on a dedicated thread (Zen/IoStore loader in cooked builds).
s.AsyncLoadingThreadEnabled=True
s.EventDrivenLoaderEnabled=True
; Post-load work per frame on the game thread (ms). Lower = smoother frames,
; longer load. 3 ms keeps a 60 fps frame budget intact while streaming.
s.AsyncLoadingTimeLimit=3.0
s.AsyncLoadingUseFullTimeLimit=False
s.PriorityAsyncLoadingExtraTime=15.0
; Spread actor/component registration of streamed levels across frames.
s.LevelStreamingActorsUpdateTimeLimit=3.0
s.PriorityLevelStreamingActorsUpdateExtraTime=5.0
s.LevelStreamingComponentsRegistrationGranularity=10
s.LevelStreamingComponentsUnregistrationGranularity=5
s.UnregisterComponentsTimeLimit=1.0
; Keep bulk data async for anything bigger than 128 KB.
s.MinBulkDataSizeForAsyncLoading=131072
s.UseBackgroundLevelStreaming=True
; Clean up streamed-out levels incrementally instead of one big GC spike.
s.ContinuouslyIncrementalGCWhileLevelsPendingPurge=True
s.ForceGCAfterLevelStreamedOut=False


;------------------------------------------------------------------------------
;  GARBAGE COLLECTION (Project Settings > Engine > Garbage Collection)
;------------------------------------------------------------------------------
[/Script/Engine.GarbageCollectionSettings]
; Smaller, more frequent GCs = shorter hitches (engine default is ~61 s).
gc.TimeBetweenPurgingPendingKillObjects=30
gc.AllowParallelGC=True
; Destroy objects over several frames under a time budget.
gc.IncrementalBeginDestroyEnabled=True
; Free UObject memory on a worker thread.
gc.MultithreadedDestructionEnabled=True
; Clusters let GC treat groups of objects (e.g. an asset and its subobjects)
; as one node -> much faster reachability analysis.
gc.CreateGCClusters=True
gc.AssetClusteringEnabled=True
; Actor/Blueprint clustering can keep levels alive longer; enable after
; testing memory in your own project.
gc.ActorClusteringEnabled=False
gc.BlueprintClusteringEnabled=False
gc.MinGCClusterSize=5
gc.FlushStreamingOnGC=False
gc.NumRetriesBeforeForcingGC=10


;------------------------------------------------------------------------------
;  PHYSICS (Project Settings > Engine > Physics)  -  see Docs/120FPS_Guide.md 20
;------------------------------------------------------------------------------
[/Script/Engine.PhysicsSettings]
; Sync physics, one step per frame. Physics cost grows with frame rate, so a
; physics-heavy 120 fps game should evaluate async physics at a fixed 60 Hz
; (bTickPhysicsAsync=True, experimental) - guide 20.1.
bTickPhysicsAsync=False
AsyncFixedTimeStepSize=0.016667
; Substepping is rarely needed at 90+ fps; enable only for unstable sims.
bSubstepping=False
MaxSubstepDeltaTime=0.016667
MaxSubsteps=4
; Clamp huge frame spikes so the solver never takes a giant, unstable step.
MaxPhysicsDeltaTime=0.033333
bEnableEnhancedDeterminism=False
; Kinematic bodies never need contacts with static geometry -> early reject.
bDisableKinematicStaticPairs=True
; Extra memory per mesh; only enable if gameplay reads UVs from hit results.
bSupportUVFromHitResults=False


;------------------------------------------------------------------------------
;  NETWORKING (harmless for single-player projects)
;------------------------------------------------------------------------------
; Engine defaults (10-15 KB/s) are from the dial-up era and cause replication
; starvation on modern connections.
[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=100000
MaxInternetClientRate=100000
NetServerMaxTickRate=60

[/Script/Engine.GameNetworkManager]
TotalNetBandwidth=500000
MaxDynamicBandwidth=100000
MinDynamicBandwidth=20000


;------------------------------------------------------------------------------
;  TIER-INDEPENDENT RUNTIME CVARS
;  (Loaded at SystemSettingsIni priority - only cvars NOT managed by any
;   scalability group belong here.)
;------------------------------------------------------------------------------
[SystemSettings]
; ---- Texture streaming safety ----
; Never let the texture pool exceed physical VRAM (prevents thrashing on
; low-VRAM GPUs when a high TextureQuality preset is chosen).
r.Streaming.LimitPoolSizeToVRAM=1
; [5.6+] Faster VT pool eviction on fast camera moves (engine now defaults 15).
r.VT.PageFreeThreshold=15

; ---- Async compute: overlap Lumen work with raster passes ----
r.Lumen.DiffuseIndirect.AsyncCompute=1

; ---- Nanite ----
; Streaming pool for Nanite cluster data (MB). 512 fits most projects;
; raise for dense open worlds if "stat nanite" shows pool pressure.
r.Nanite.Streaming.StreamingPoolSize=512

; ---- Parallel rendering (engine defaults, pinned so nothing disables them) --
r.RDG.ParallelExecute=1
r.ParallelBasePass=1
r.ParallelShadows=1
r.ParallelTranslucency=1
r.MeshDrawCommands.ParallelPassSetup=1
r.MeshDrawCommands.DynamicInstancing=1

; ---- Animation threading ----
a.ParallelAnimUpdate=1
a.ParallelAnimEvaluation=1
a.ParallelAnimInterpolation=1
; Update Rate Optimization (per-mesh bEnableUpdateRateOptimizations still
; decides who uses it): distant skeletal meshes tick at lower rates.
a.URO.Enable=1

; ---- Networking CPU ----
; Skip replication checks for actors that rarely change.
net.UseAdaptiveNetUpdateFrequency=1

; ---- Level streaming [5.6+] ----
; One shared time budget for async loading + level streaming per frame.
s.UseUnifiedTimeBudgetForStreaming=1


;------------------------------------------------------------------------------
;  OPT-IN / EXPERIMENTAL - uncomment after profiling in YOUR project
;------------------------------------------------------------------------------
[ConsoleVariables]
; [5.6+] VSM receiver mask: much better clipmap culling in dense scenes with
; dynamic lights. Can conflict with r.Shadow.Virtual.MaxDOFResolutionBias.
;r.Shadow.Virtual.UseReceiverMask=1

; [5.6+] Lumen HWRT far field in occlusion-only mode (~50% cheaper).
;r.LumenScene.FarField.OcclusionOnly=1

; Async compute for Lumen reflections (experimental on some GPUs).
;r.Lumen.Reflections.AsyncCompute=1

; [5.4+] Incremental GC reachability (split marking over frames, 2 ms/frame).
; EXPERIMENTAL: requires every UPROPERTY object pointer to be TObjectPtr and is
; not fully thread-safe. Epic suggests it mainly for dedicated servers.
;gc.AllowIncrementalReachability=1
;gc.AllowIncrementalGather=1
;gc.IncrementalReachabilityTimeLimit=0.002

; [5.6+] Batched tick functions (lower tick overhead with many actors).
;tick.AllowBatchedTicks=1

; Lower input latency by syncing game thread with RHI (costs some throughput).
;r.GTSyncType=1
