;==============================================================================
;  GlobalIlluminationQuality
;  Lumen stays ON at Medium. Switching GI off changes the whole look of the
;  game, which is the biggest visual loss of all. Medium uses the cheapest Lumen
;  path (global SDF tracing, coarse radiosity, downsampled integration); dynamic
;  resolution absorbs the rest.
;  Low (fallback for iGPU / very old GPUs) turns Lumen off.
;==============================================================================
; Low
[GlobalIlluminationQuality@0]
r.DistanceFieldAO=0
r.AOQuality=0
r.Lumen.DiffuseIndirect.Allow=0
r.LumenScene.Radiosity.ProbeSpacing=16
r.LumenScene.Radiosity.HemisphereProbeResolution=3
r.LumenScene.Radiosity.UpdateFactor=128
r.LumenScene.DirectLighting.UpdateFactor=64
r.LumenScene.FastCameraMode=1
r.Lumen.TraceMeshSDFs.Allow=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.IrradianceFormat=1
r.Lumen.ScreenProbeGather.StochasticInterpolation=1
r.Lumen.ScreenProbeGather.SpatialFilterNumPasses=1
r.Lumen.ScreenProbeGather.ShortRangeAO=0
r.Lumen.ScreenProbeGather.IntegrateDownsampleFactor=2
r.Lumen.TranslucencyVolume.Enable=0
r.Lumen.TranslucencyVolume.GridPixelSize=64
r.Lumen.TranslucencyVolume.TraceFromVolume=0

; Medium
[GlobalIlluminationQuality@1]
r.DistanceFieldAO=1
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=16
r.LumenScene.Radiosity.HemisphereProbeResolution=3
r.LumenScene.Radiosity.UpdateFactor=128
r.LumenScene.DirectLighting.UpdateFactor=64
r.LumenScene.FastCameraMode=1
r.Lumen.TraceMeshSDFs.Allow=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.IrradianceFormat=1
r.Lumen.ScreenProbeGather.StochasticInterpolation=1
r.Lumen.ScreenProbeGather.SpatialFilterNumPasses=1
r.Lumen.ScreenProbeGather.ShortRangeAO=1
