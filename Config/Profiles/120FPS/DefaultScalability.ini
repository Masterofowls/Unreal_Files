;==============================================================================
;  ReflectionQuality
;  Lumen reflections are the most variable Lumen cost (Epic). Rough surfaces
;  (> clamp) reuse the diffuse GI instead of tracing. Medium keeps Lumen
;  reflections at half resolution. If Medium misses budget, set Allow=0 here
;  FIRST (Epic measures ~1 ms saving) and place Sphere Reflection Captures in
;  key interiors as the fallback.
;==============================================================================
; Low
[ReflectionQuality@0]
r.SSR.Quality=1
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=0
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.3
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0

; Medium
[ReflectionQuality@1]
r.SSR.Quality=2
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.3
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0

; High
[ReflectionQuality@2]
r.SSR.Quality=2
r.SSR.HalfResSceneColor=0
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.4
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0

; Epic
[ReflectionQuality@3]
r.SSR.Quality=3
r.SSR.HalfResSceneColor=0
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.6
r.Lumen.TranslucencyReflections.FrontLayer.Allow=1

; Cinematic
[ReflectionQuality@Cine]
r.SSR.Quality=4
r.SSR.HalfResSceneColor=0
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
