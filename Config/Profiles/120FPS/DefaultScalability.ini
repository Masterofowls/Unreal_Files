;==============================================================================
;  TextureQuality
;  Texture sharpness costs VRAM, not frame time. Medium keeps MipBias 0 (full
;  detail) and relies on r.Streaming.LimitPoolSizeToVRAM to stay inside 6-8 GB.
;  High pool = 2500 MB leaves ~3 GB of an 8 GB card for Nanite, VSM, Lumen,
;  render targets and the OS.
;==============================================================================
; Low
[TextureQuality@0]
r.Streaming.MipBias=1
r.Streaming.PoolSize=1000
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=4

; Medium
[TextureQuality@1]
r.Streaming.MipBias=0
r.Streaming.PoolSize=1600
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8

; High
[TextureQuality@2]
r.Streaming.MipBias=0
r.Streaming.PoolSize=2500
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=8

; Epic
[TextureQuality@3]
r.Streaming.MipBias=0
r.Streaming.PoolSize=3500
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=8

; Cinematic
[TextureQuality@Cine]
r.Streaming.MipBias=0
r.Streaming.PoolSize=4000
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=8


