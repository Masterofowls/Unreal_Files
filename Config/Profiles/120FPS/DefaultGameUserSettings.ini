;==============================================================================
;  DefaultGameUserSettings.ini  -  First-launch defaults for a 120 fps game
;==============================================================================
;  Copy to Config/DefaultGameUserSettings.ini. These are only the defaults.
;  The player's own GameUserSettings.ini (Saved/Config) overrides them after
;  the first save.
;  Call UGameUserSettings::RunHardwareBenchmark() + ApplyHardwareBenchmarkResults()
;  on first launch so the tier is picked automatically (guide 11).
;==============================================================================

[/Script/Engine.GameUserSettings]
; Cap at 120. With a VRR (G-Sync/FreeSync) display this gives the smoothest
; pacing; without VRR use a 120 Hz mode or enable VSync.
FrameRateLimit=120.000000
bUseVSync=False
; Enables r.DynamicRes (OperationMode=1) with the 8.33 ms budget.
bUseDynamicResolution=True
; Quality tier is not set here: the hardware benchmark picks it.
ResolutionSizeX=1920
ResolutionSizeY=1080
FullscreenMode=1
LastUserConfirmedFullscreenMode=1
PreferredFullscreenMode=1
