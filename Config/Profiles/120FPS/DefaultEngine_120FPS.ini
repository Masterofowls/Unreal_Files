;==============================================================================
;  DefaultEngine_120FPS.ini  -  ADD-ON for the 120 fps profile
;==============================================================================
;  This is NOT a standalone file. Merge each section below into the section
;  with the same name in Config/DefaultEngine.ini (from this repo). Where a key
;  already exists, the value here wins.
;  None of these cvars are managed by DefaultScalability.ini.
;==============================================================================


[/Script/Engine.RendererSettings]
; ---- Upscaling baseline ----
; TSR stays the default. DLSS / FSR / XeSS plugins can replace it (guide 7).
r.AntiAliasingMethod=4
; Hardware RT stays OFF: software Lumen is cheaper on 8 GB cards and saves
; the BVH memory (AMD measured ~1.2 ms saving vs HWRT).
r.RayTracing=False
r.Lumen.HardwareRayTracing=False


[SystemSettings]
; ---- Dynamic resolution: the core of "120 fps without losing visuals" ----
; The GPU renders as many pixels as fit in 8.33 ms, then TSR reconstructs to
; the output resolution. Calm scenes run near native; heavy scenes drop
; resolution instead of dropping frames.
; 1 = controlled by GameUserSettings bUseDynamicResolution (player toggle).
r.DynamicRes.OperationMode=1
; 1000 / 120 = 8.33 ms. If the player changes the frame cap, update this from
; code with ECVF_SetByCode (guide 7.3), because SetByGameSetting has lower
; priority than this ini.
r.DynamicRes.FrameTimeBudget=8.33
; Floor/ceiling. Below 50% TSR can't reconstruct 1080p cleanly.
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=100
; Keep ~10% of the GPU frame free so spikes don't miss vsync/VRR windows.
r.DynamicRes.TargetedGPUHeadRoom=10

; ---- Async compute: overlap Lumen with raster work ----
; These three together move Lumen scene lighting, GI and reflections onto
; the async queue (Epic Lumen performance guide).
; Disable them together with r.Lumen.AsyncCompute=0 only while profiling.
r.LumenScene.Lighting.AsyncCompute=1
r.Lumen.DiffuseIndirect.AsyncCompute=1
r.Lumen.Reflections.AsyncCompute=1

; ---- Nanite ----
; Keep the hardware/software raster split at the vendor-recommended value.
r.Nanite.MinPixelsPerEdgeHW=32

; ---- Animation Budget Allocator (plugin "AnimationBudgetAllocator") ----
; Only affects SkeletalMeshComponentBudgeted components. Keeps skeletal
; animation under a fixed game-thread budget; distant characters update less
; often first. 1.0 ms fits a 120 fps game thread budget on 6-core CPUs.
a.Budget.Enabled=1
a.Budget.BudgetMs=1.0

; ---- UI ----
; Slate global invalidation: widgets repaint only when changed. Large
; game-thread win for HUD-heavy games. Test your UI after enabling it.
Slate.EnableGlobalInvalidation=1

; ---- Frame pacing ----
; Keep game/render thread overlap (default). Don't use r.GTSyncType=1 at
; 120 fps unless you need lowest latency and have CPU headroom.
r.OneFrameThreadLag=1
r.VSync=0


[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False


[ConsoleVariables]
; ---- Optional [5.6+] CPU wins: test in your project, then enable ----
; Batch scene component transform updates later in the frame.
;s.GroupedComponentMovement.Enable=1
; Batch tick functions to reduce per-actor tick overhead.
;tick.AllowBatchedTicks=1
; VSM receiver mask: better clipmap culling in dense scenes with lights.
;r.Shadow.Virtual.UseReceiverMask=1
