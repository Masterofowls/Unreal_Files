;==============================================================================
;  DefaultEngine_UE58.ini  -  ADD-ON for Unreal Engine 5.8 projects
;==============================================================================
;  Merge each section into the section with the same name in
;  Config/DefaultEngine.ini (and after DefaultEngine_120FPS.ini if you use the
;  120 fps profile). See Docs/UE58_Guide.md for the reasoning behind every line.
;  None of these cvars are managed by DefaultScalability.ini.
;==============================================================================


[SystemSettings]
; ---- MegaLights (production-ready in 5.8) ----
; This repo's profiles don't use MegaLights (they target 8 GB GPUs without
; hardware ray tracing). 0 stops the engine compiling MegaLights shaders:
; fewer shader permutations, faster cooks, smaller PSO cache.
; DELETE this line if you enable MegaLights (Project Settings > Rendering >
; Direct Lighting > MegaLights). Docs/Lighting_PostProcess_Guide.md, section 6.
r.MegaLights.Supported=0

; ---- Lumen ----
; Apply height fog to Lumen reflection hits: reflections in fogged scenes
; match the scene. Small extra cost. Keep 0 (default) for clear-sky games.
;r.Lumen.HeightFog=1
; Skip unlit shading-model hits in screen traces: less GI noise from unlit
; VFX or UI meshes in the world. Test your scenes before enabling.
;r.Lumen.ScreenProbeGather.ScreenTraces.HZBTraversal.SkipUnlitHits=1


[ConsoleVariables]
; ---- Optional 5.8 features: test in your project, then enable ----

; Hierarchical CPU culling for non-Nanite instanced static meshes (runtime).
; Helps scenes with very many non-Nanite ISM instances. Offline precompute
; is already on by default (r.SceneCulling.HierarchicalCPUCulling.ProjectEnabled).
;r.SceneCulling.HierarchicalCPUCulling=1

; Just-in-time async loading: batches and trickles many async load requests
; instead of flooding the loader. Also requires compiling with
; UE_ENABLE_STREAMABLE_JIT_ASYNC_LOADING=1 in your Target.cs / Build.cs.
;s.StreamableEnableJITAsyncLoadingGlobally=1

; Throttle VSM invalidations caused by Nanite LOD changes
; (r.Nanite.VSMInvalidateOnLODDelta). Default is unlimited. Tune if Nanite
; streaming causes shadow-cost spikes.
;r.Shadow.Virtual.DeferredInvalidationBudget=<value>

; Nanite tessellation in shadows: turn off when displacement is only needed
; in the main view (saves shadow raster cost).
;r.Shadow.Virtual.Nanite.AllowTessellationDirectional=0
;r.Shadow.Virtual.Nanite.AllowTessellationLocal=0

; Only if GPU Scene's view-distance workaround isn't needed by your project.
;r.GPUScene.ViewDistanceScaleWorkaround=0

; ---- Profiling conveniences (development only) ----
; More readable ProfileGPU log output.
;r.ProfileGPU.TableFormatting=0
; Adds frame number and UTC time to "stat unit" (useful for matching captures).
;stats.UnitTimestamp=1
