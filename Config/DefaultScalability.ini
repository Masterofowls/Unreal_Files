;==============================================================================
;  REFLECTIONS  (Lumen High+ ; SSR fallback)
;  MaxRoughnessToTraceClamp: rough surfaces reuse the diffuse GI instead of
;  tracing dedicated reflection rays (Intel UE5 guide).
;==============================================================================
[ReflectionQuality@0]
r.SSR.Quality=0
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=0
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.4
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0

[ReflectionQuality@1]
