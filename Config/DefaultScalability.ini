;==============================================================================
;  DefaultScalability.ini  -  Performance-tuned quality tiers (UE 5.3 - 5.7)
;==============================================================================
;  Tier index:  @0 = Low | @1 = Medium | @2 = High | @3 = Epic | @Cine
;
;  Design targets
;    Low    : iGPU / GTX 1060-class, 30-60 fps @ 1080p. No Lumen, cheap shadows.
;    Medium : GTX 1660 / RX 580-class, 60 fps. No Lumen (DFAO + SSR instead).
;    High   : RTX 2070 / RX 6600-class, 60 fps. Lumen "High" = Epic's 60 fps
;             path, VSM with reduced resolution & ray counts.
;    Epic   : RTX 3070+ / RX 6800+, 60 fps. Slightly leaner than stock Epic
;             (which targets 30 fps on consoles).
;    Cine   : Offline renders / Movie Render Queue only.
;
;  Rules followed here
;   * EVERY cvar appears in EVERY tier of its group. If a cvar is set only in
;     some tiers, switching presets "leaks" the last value (Intel UE5 guide).
;   * These cvars must NOT also be set in DefaultEngine.ini
;     ([SystemSettings]/[ConsoleVariables]/RendererSettings); those have higher
;     priority and would silently freeze the value for all tiers.
;   * Keys not listed here fall back to Engine/Config/BaseScalability.ini.
;   * Cvars tagged [5.x+] are ignored by older engines.
;==============================================================================


;------------------------------------------------------------------------------
;  Auto-detect thresholds ("scalability auto" / RunHardwareBenchmark)
;  Stock values ("GPU 18 42 115") date from ~2014 hardware and put most modern
;  GPUs straight into Epic. Raised per Intel's UE5 optimization guide; tune
;  after running "synthbenchmark" on your min/rec spec machines.
;------------------------------------------------------------------------------
[ScalabilitySettings]
PerfIndexThresholds_ResolutionQuality="GPU 150 260 550"
PerfIndexThresholds_GlobalIlluminationQuality="GPU 150 260 550"
PerfIndexThresholds_ReflectionQuality="GPU 150 260 550"
PerfIndexThresholds_PostProcessQuality="GPU 150 260 550"
PerfIndexThresholds_EffectsQuality="GPU 150 260 550"


;==============================================================================
;  VIEW DISTANCE
;==============================================================================
[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=2
r.ViewDistanceScale=0.6
r.Nanite.MaxPixelsPerEdge=2

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.8
r.Nanite.MaxPixelsPerEdge=1.5

[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
