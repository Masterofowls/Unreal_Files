;==============================================================================
;  DefaultEditorPerProjectUserSettings.ini  -  Safe editor defaults for a team
;==============================================================================
;  Copy to <Project>/Config/. Each developer's own
;  Saved/Config/<Platform>Editor/EditorPerProjectUserSettings.ini overrides
;  these after they change a preference, so also mention them in onboarding.
;  See Docs/Common_Bugs_Guide.md section 2.
;==============================================================================

[/Script/LiveCoding.LiveCodingSettings]
; Keep Live Coding ON. Turning it off silently falls back to Hot Reload, which
; is the older system that corrupts Blueprints.
bEnabled=True
; Reinstancing patches existing objects when a class layout changes. It can
; silently save temporary data into .uasset files (broken components, blank
; details panels, properties that won't save). Off = Live Coding only patches
; function bodies. For header / UPROPERTY / constructor changes, close the
; editor and build from the IDE.
bEnableReinstancing=False
; Don't try to Live Code brand-new reflected classes created by the wizard.
bAutomaticallyCompileNewClasses=False
