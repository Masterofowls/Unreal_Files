;==============================================================================
;  DefaultGame.ini  -  Packaging settings for fast loading & small builds
;==============================================================================
;  Merge into <YourProject>/Config/DefaultGame.ini. Keep your own
;  [/Script/EngineSettings.GeneralProjectSettings] (ProjectID, name, etc.).
;==============================================================================

[/Script/UnrealEd.ProjectPackagingSettings]
; Shipping by default; switch to Development/Test only for profiling builds
; (use Test builds for benchmarks - Development adds ~30% variance).
BuildConfiguration=PPBC_Shipping
IncludeDebugFiles=False
IncludePrerequisites=True

; ---- Container format: IoStore (Zen loader) = fastest async loading --------
UsePakFile=True
bUseIoStore=True
bUseZenStore=False
; Compress containers; Oodle Kraken decompresses fast with a good ratio.
bCompressed=True
PackageCompressionFormat=Oodle
PackageCompressionMethod=Kraken
PackageCompressionLevel_DebugDevelopment=4
PackageCompressionLevel_TestShipping=5
PackageCompressionLevel_Distribution=7

; ---- Shaders: share code between materials, required for bundled PSOs ------
; Deduplicates identical shader bytecode across materials -> smaller
; packages, less memory, faster load, and enables the shader pipeline cache.
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True

; ---- Content ----------------------------------------------------------------
; Only cook maps/assets actually referenced (list maps in MapsToCook).
bCookAll=False
bCookMapsOnly=False
